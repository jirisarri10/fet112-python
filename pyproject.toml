[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fet112"
version = "0.1.0"
description = "Official Python client for FET112 verifiable security intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "FET112"}
]
keywords = ["fet112", "fetch", "fetchai", "security", "agents", "preflight", "a2a", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.fet112.com"
Documentation = "https://www.fet112.com/developers"

[project.scripts]
fet112 = "fet112.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fet112"]
